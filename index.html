<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Public app policies and documentation from Crow Game Studio.">
  <title>Crow Game Studio | App Documentation</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202638; background: #f4f6fb; line-height: 1.7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 800px; margin: 64px auto; padding: 40px; background: #fff; border: 1px solid #e0e5f0; border-radius: 20px; }
    .publisher { color: #535e74; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { color: #222b46; font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.2; letter-spacing: -.035em; }
    h2 { font-size: 1.3rem; margin: 0 0 8px; }
    a { color: #2255b8; text-underline-offset: .2em; overflow-wrap: anywhere; }
    a:focus-visible { outline: 3px solid #8548d6; outline-offset: 4px; }
    article { margin-top: 28px; padding: 24px; background: #f0f5ff; border-radius: 12px; }
    article p { margin: 0 0 16px; }
    footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #e0e5f0; font-size: .9rem; }
    @media (max-width: 600px) { main { margin: 0; padding: 28px 22px; border: 0; border-radius: 0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="publisher">Crow Game Studio</div>
      <h1>App policies &amp; documentation</h1>
      <p>Find the public policies for our apps below.</p>
    </header>
    <article aria-labelledby="lalacalc">
      <h2 id="lalacalc">LalaCalc: Graphing Calculator</h2>
      <p>Scientific calculations, graphs, equations, statistics, and Python programming for Android.</p>
      <a href="lalacalc/privacy-policy/">Read the LalaCalc Privacy Policy</a>
    </article>
    <footer>Contact Crow Game Studio: <a href="mailto:ejherran.c@gmail.com">ejherran.c@gmail.com</a></footer>
  </main>
</body>
</html>
